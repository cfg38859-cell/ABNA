name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # مرحله اصلاح شده: ساخت پوشه اندروید در صورت نبود
      - name: Prepare Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node build/android-prepare.mjs

      # مرحله اصلاح شده: ساخت APK با Gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heyat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
