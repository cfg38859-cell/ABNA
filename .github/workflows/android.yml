name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # ساخت نسخه وب (پوشه dist) - لازم است قبل از Capacitor
      - name: Build web
        run: npm run build

      # ساخت پوشه اندروید و همگام‌سازی با وب
      - name: Prepare Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node build/android-prepare.mjs
          echo "--- فایل‌های آیکون ---"
          ls -la assets
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heyat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
